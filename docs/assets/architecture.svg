<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">IEEE-CIS fraud detection research architecture</title>
  <desc id="archDesc">Serpentine diagram: data preparation feeds a modeling and validation stage, which feeds a local FastAPI and SHAP serving stage with reproducibility and governance controls.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#64748b"/>
    </marker>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .stage { font: 700 13px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif; letter-spacing: 0.08em; }
      .box-title { font: 700 15px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .box-line { font: 400 12.5px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; fill: #475569; }
      .note { font: 400 12.5px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; fill: #64748b; }
      .link { font: 600 11.5px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1240" height="640" fill="#f8fafc"/>

  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0f172a">IEEE-CIS Fraud Detection — Research Architecture</text>
  <text x="60" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Leakage-safe pipeline from competition data to a local, explainable inference service</text>

  <!-- Stage labels -->
  <text x="60" y="112" class="stage" fill="#0284c7">1 · DATA PREPARATION</text>
  <text x="60" y="282" class="stage" fill="#4f46e5">2 · MODELING &amp; VALIDATION</text>
  <text x="60" y="452" class="stage" fill="#059669">3 · SERVING, EXPLAINABILITY &amp; GOVERNANCE</text>

  <!-- Row 1: left to right -->
  <g filter="url(#softShadow)">
    <rect x="60" y="130" width="250" height="90" rx="12" class="box"/>
    <rect x="340" y="130" width="250" height="90" rx="12" class="box"/>
    <rect x="620" y="130" width="250" height="90" rx="12" class="box"/>
    <rect x="900" y="130" width="250" height="90" rx="12" class="box"/>
  </g>
  <text x="185" y="160" text-anchor="middle" class="box-title">IEEE-CIS raw data</text>
  <text x="185" y="182" text-anchor="middle" class="box-line">Kaggle competition</text>
  <text x="185" y="200" text-anchor="middle" class="box-line">not distributed</text>

  <text x="465" y="160" text-anchor="middle" class="box-title">Data integration</text>
  <text x="465" y="182" text-anchor="middle" class="box-line">transactions + identity</text>
  <text x="465" y="200" text-anchor="middle" class="box-line">590,540 rows</text>

  <text x="745" y="160" text-anchor="middle" class="box-title">Leakage-safe preprocessing</text>
  <text x="745" y="182" text-anchor="middle" class="box-line">fit on training rows only</text>
  <text x="745" y="200" text-anchor="middle" class="box-line">434 → 495 features</text>

  <text x="1025" y="160" text-anchor="middle" class="box-title">Stratified split</text>
  <text x="1025" y="182" text-anchor="middle" class="box-line">80/20 · seed 42</text>
  <text x="1025" y="200" text-anchor="middle" class="box-line">472,432 / 118,108</text>

  <line x1="310" y1="175" x2="334" y2="175" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="590" y1="175" x2="614" y2="175" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="870" y1="175" x2="894" y2="175" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Row 1 to Row 2 -->
  <line x1="1025" y1="220" x2="1025" y2="292" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowDown)"/>
  <text x="1040" y="260" class="link">training rows</text>

  <!-- Row 2: right to left -->
  <g filter="url(#softShadow)">
    <rect x="900" y="300" width="250" height="90" rx="12" class="box"/>
    <rect x="620" y="300" width="250" height="90" rx="12" class="box"/>
    <rect x="340" y="300" width="250" height="90" rx="12" class="box"/>
    <rect x="60" y="300" width="250" height="90" rx="12" class="box"/>
  </g>
  <text x="1025" y="330" text-anchor="middle" class="box-title">Baseline &amp; comparison</text>
  <text x="1025" y="352" text-anchor="middle" class="box-line">SGD · RF · GB · XGBoost</text>
  <text x="1025" y="370" text-anchor="middle" class="box-line">canonical Average Precision</text>

  <text x="745" y="330" text-anchor="middle" class="box-title">Tuned Random Forest</text>
  <text x="745" y="352" text-anchor="middle" class="box-line">20 trees · balanced weights</text>
  <text x="745" y="370" text-anchor="middle" class="box-line">5-fold training-only CV</text>

  <text x="465" y="330" text-anchor="middle" class="box-title">OOF threshold selection</text>
  <text x="465" y="352" text-anchor="middle" class="box-line">0.35 · training only</text>
  <text x="465" y="370" text-anchor="middle" class="box-line">illustrative cost 1:5</text>

  <text x="185" y="330" text-anchor="middle" class="box-title">Frozen artifacts</text>
  <text x="185" y="352" text-anchor="middle" class="box-line">model · preprocessor</text>
  <text x="185" y="370" text-anchor="middle" class="box-line">threshold + metadata</text>

  <line x1="900" y1="345" x2="876" y2="345" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="345" x2="596" y2="345" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="340" y1="345" x2="316" y2="345" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Row 2 to Row 3 -->
  <line x1="185" y1="390" x2="185" y2="462" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowDown)"/>
  <text x="200" y="430" class="link">frozen model + preprocessor</text>

  <!-- Row 3: left to right -->
  <g filter="url(#softShadow)">
    <rect x="60" y="470" width="250" height="90" rx="12" class="box"/>
    <rect x="340" y="470" width="250" height="90" rx="12" class="box"/>
    <rect x="620" y="470" width="250" height="90" rx="12" class="box"/>
    <rect x="900" y="470" width="250" height="90" rx="12" class="box" stroke="#f59e0b"/>
  </g>
  <text x="185" y="500" text-anchor="middle" class="box-title">FastAPI service</text>
  <text x="185" y="522" text-anchor="middle" class="box-line">/predict · /predict/batch</text>
  <text x="185" y="540" text-anchor="middle" class="box-line">/health · strict 422 checks</text>

  <text x="465" y="500" text-anchor="middle" class="box-title">SHAP explainability</text>
  <text x="465" y="522" text-anchor="middle" class="box-line">TreeExplainer · class-1 aligned</text>
  <text x="465" y="540" text-anchor="middle" class="box-line">global + local factors</text>

  <text x="745" y="500" text-anchor="middle" class="box-title">Reproducibility layer</text>
  <text x="745" y="522" text-anchor="middle" class="box-line">SHA-256 artifact manifest</text>
  <text x="745" y="540" text-anchor="middle" class="box-line">21 tests · ruff · GitHub Actions</text>

  <text x="1025" y="500" text-anchor="middle" class="box-title" fill="#b45309">Research boundary</text>
  <text x="1025" y="522" text-anchor="middle" class="box-line">local only · no auth/TLS</text>
  <text x="1025" y="540" text-anchor="middle" class="box-line">not approved for production</text>

  <line x1="310" y1="515" x2="334" y2="515" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="590" y1="515" x2="614" y2="515" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="870" y1="515" x2="894" y2="515" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="60" y="612" class="note">All metrics are retrospective on the reserved IEEE-CIS test split. Raw data is not included; model artifacts are research/education only.</text>
</svg>
